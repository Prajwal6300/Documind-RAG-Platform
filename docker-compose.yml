version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: documind-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - GEMINI_EMBEDDING_MODEL=${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-gemini}
      - ENABLE_RERANKER=${ENABLE_RERANKER:-true}
      - RAG_DEBUG=${RAG_DEBUG:-false}
    volumes:
      - ./data/uploads:/app/data/uploads
      - ./data/logs:/app/data/logs
    restart: unless-stopped
